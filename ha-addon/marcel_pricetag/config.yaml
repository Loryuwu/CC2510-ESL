# Home-Assistant-Addon: Marcel PriceTag
# Baut die ESP-Gateway-Firmware, flasht das Gateway (OTA/USB/Browser) und
# flasht spaeter CC2510-Tags ueber den ESP32-S3-CCLib-Debugger.
name: "Marcel PriceTag"
version: "0.1.0"
slug: marcel_pricetag
description: "PriceTag: ESP-Gateway-Firmware bauen & flashen, CC2510-Tags flashen"
url: "https://github.com/marcel7162/CC2510-ESL"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: PriceTag
startup: services
boot: manual
# USB-Zugriff fuer USB-Flash (Gateway) und CCLib-Debugger (Tags):
uart: true
usb: true
# Persistenter Build-Cache + geklonte Quellen liegen in /data (Addon-Volume).
options:
  repo_url: "https://github.com/marcel7162/CC2510-ESL"
  branch: "main"
  gateway_host: "pricetag-ap.local"
  wifi_ssid: ""
  wifi_pass: ""
schema:
  repo_url: str
  branch: str
  gateway_host: str
  wifi_ssid: str?
  wifi_pass: password?
