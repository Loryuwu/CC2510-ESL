; PlatformIO-Projekt fuer das PriceTag-Wetter-Gateway (ESP32-S3 + nRF24L01+).
; Quelle ist der unveraenderte Arduino-Sketch in src/gateway_weather.ino -
; PlatformIO praeprozessiert .ino wie die Arduino IDE (Prototypen, Arduino.h).
;
; Bauen:   pio run
; Flashen: pio run -t upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
; pioarduino-Fork = aktueller arduino-esp32 3.x-Core (IDF 5.x). Der offizielle
; "espressif32" ist bei 2.0.11 eingefroren und bringt das WLAN-PHY auf dem S3
; nicht hoch (Scan 0 / Status 255) - genau der 3.x-Core laeuft in der Arduino IDE.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Dein S3 hat nur 4 MB Flash (ROM meldet 0x400000). Der neue Core nimmt sonst
; 8 MB an -> Partitionstabelle ragt ueber das Flash-Ende -> Boot-Loop.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv

; Serieller Port (Upload + Monitor). Bei Bedarf anpassen.
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200

; ESP32-S3 Devkits melden sich meist als natives USB-CDC -> Serial ueber USB.
; Falls dein Board stattdessen einen UART-Bridge-Chip (CP210x/CH340) nutzt,
; diese beiden Flags entfernen, dann laeuft Serial ueber UART0.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    nrf24/RF24@^1.4.11
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1
