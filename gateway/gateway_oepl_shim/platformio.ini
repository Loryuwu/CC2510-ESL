; PriceTag Gateway als OpenEPaperLink-AP-Shim (ESP32-S3 + nRF24L01+).
;
; Emuliert nach aussen die OEPL-AP-Schnittstelle (HTTP + WebSocket), damit die
; OEPL-Home-Assistant-Integration + der ESPHome-Designer (Drag&Drop) genutzt
; werden koennen. HA rendert das fertige JPEG und laedt es per /imgupload hoch;
; der Shim quantisiert es zu Schwarz/Weiss/Rot und funkt es per bewaehrtem
; RLE-Stream zum CC2510 (Funk-/Enroll-Code 1:1 aus gateway_weather_pio).
;
; Bauen/Flashen aus PowerShell (nicht Git-Bash): pio run -t upload

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

upload_port = COM10
monitor_port = COM10
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    nrf24/RF24@^1.4.11
    mathieucarbou/ESPAsyncWebServer@^3.6.0
    bodmer/TJpg_Decoder@^1.1.0
